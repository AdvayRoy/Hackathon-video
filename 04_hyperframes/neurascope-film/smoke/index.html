<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #07080a; }
      #root { width: 100%; height: 100%; position: relative; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .clip { position: absolute; inset: 0; }
      #shot { overflow: hidden; }
      #shot-inner { width: 100%; height: 100%; transform-origin: 62% 40%; will-change: transform; }
      #shot-inner video { width: 100%; height: 100%; object-fit: cover; border-radius: 0; }
      #title { display: flex; align-items: center; justify-content: center; }
      #title h1 { color: #f4f4f5; font-size: 96px; font-weight: 600; letter-spacing: -0.04em; }
      #title span { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <div id="title" class="clip" data-start="0" data-duration="1.5" data-track-index="1">
        <h1>PIPELINE <span>TEST</span></h1>
      </div>
      <div id="shot" class="clip">
        <div id="shot-inner">
          <video id="shot-video" class="clip" src="assets/pipeline_test_src.mp4" muted data-start="1.5" data-duration="2.5" data-media-start="0.5" data-track-index="0"></video>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title h1", { opacity: 0, y: 30, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 0);
      tl.to("#title h1", { opacity: 0, duration: 0.3 }, 1.2);
      tl.fromTo("#shot-inner", { scale: 1 }, { scale: 1.35, x: -120, y: -60, duration: 2.5, ease: "power2.inOut" }, 1.5);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
